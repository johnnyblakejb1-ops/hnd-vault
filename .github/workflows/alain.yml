name: alain-scrape

on:
  schedule:
    - cron: "30 3,15 * * *"   # 04:30 & 16:30 Lagos time (UTC+1), every day
  workflow_dispatch:
    inputs:
      max_links:
        description: "max NEW documents this run (0 = run until the time cap)"
        default: "5"
      pages_per_doc:
        description: "pages to capture per document (0 = all pages)"
        default: "0"
      time_cap:
        description: "hard stop after this many minutes"
        default: "180"

permissions:
  contents: write

concurrency:
  group: alain
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Alain probes Scribd (robot mode)
        env:
          ALAIN_MAX_LINKS: ${{ github.event.inputs.max_links || '5' }}
          ALAIN_PAGES_PER_DOC: ${{ github.event.inputs.pages_per_doc || '0' }}
          ALAIN_TIME_CAP: ${{ github.event.inputs.time_cap || '180' }}
        run: python alain_auto.py

      - name: Commit screenshots
        run: |
          git config user.name  "alain-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          if git diff --cached --quiet; then
            echo "nothing new this run"
          else
            git commit -m "alain: capture $(date -u +'%Y-%m-%d %H:%M') [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
