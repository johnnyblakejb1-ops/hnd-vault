name: bea-stitch

on:
  workflow_run:
    workflows: ["alain-scrape"]
    types: [completed]
  push:
    paths:
      - "screenshots/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stitch:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Bea stitches the new papers (pink paper + branded cover)
        run: python stitch_papers.py --dir screenshots --out PDFs --pink --dpi 150

      - name: Commit PDFs
        run: |
          git config user.name  "bea-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PDFs
          if git diff --cached --quiet; then
            echo "no new PDFs"
          else
            git commit -m "bea: stitch $(date -u +'%Y-%m-%d %H:%M') [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Upload PDFs bundle (easy grab)
        uses: actions/upload-artifact@v4
        with:
          name: hnd-pdfs
          path: PDFs
          retention-days: 30
          overwrite: true
